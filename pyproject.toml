[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibedapps"
version = "0.1.0"
description = "Multi-agent DApp generator: smart contracts, backend, frontend, tests, and security audit from a single spec"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.4",
    "openai>=1.3",
    "httpx>=0.25",
    "structlog>=23.0",
    "fastapi>=0.103",
]

[project.optional-dependencies]
cli = ["rich>=13.0"]

[project.scripts]
vibedapps = "vibedapps.cli:main"

[tool.setuptools.packages.find]
include = ["vibedapps*"]

[tool.setuptools.package-data]
vibedapps = ["templates/**/*", "templates/**/.*"]
