<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DApp</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 min-h-screen">
  <header class="bg-gray-800 text-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <a href="index.html" class="text-xl font-bold">DApp</a>
      
      <nav class="hidden md:flex space-x-6">
        <a href="index.html" class="hover:text-blue-400">Home</a>
        <a href="about.html" class="hover:text-blue-400">About</a>
      </nav>
      
      <div>
        <button 
          id="connectButton"
          class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-md"
        >
          Connect Wallet
        </button>
        <div id="accountInfo" class="hidden">
          <span id="accountAddress" class="px-4 py-2 bg-gray-700 rounded-full"></span>
          <button 
            id="disconnectButton"
            class="ml-4 px-4 py-2 bg-red-600 hover:bg-red-700 rounded-md"
          >
            Disconnect
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-8 text-center">Welcome to Our DApp</h1>
    
    <div id="errorMessage" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-8" role="alert">
      <p id="errorText"></p>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <div class="bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-xl font-semibold mb-4">Connection Status</h2>
        <div id="connectionStatus">
          <p class="text-yellow-600">Wallet not connected. Please connect your wallet to use the DApp.</p>
        </div>
      </div>
      
      <div class="bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-xl font-semibold mb-4">Contract Interaction</h2>
        <div id="contractInteraction">
          <p class="text-gray-600">Connect your wallet to interact with the contract.</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-gray-800 text-white py-6 mt-auto">
    <div class="container mx-auto px-4">
      <div class="flex flex-col md:flex-row justify-between items-center">
        <div class="mb-4 md:mb-0">
          <h3 class="text-xl font-bold">DApp</h3>
          <p class="text-gray-400 mt-2">Powered by Blockchain Technology</p>
        </div>
        
        <div class="flex space-x-4">
          <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="hover:text-blue-400">
            GitHub
          </a>
          <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" class="hover:text-blue-400">
            Twitter
          </a>
          <a href="https://discord.com" target="_blank" rel="noopener noreferrer" class="hover:text-blue-400">
            Discord
          </a>
        </div>
      </div>
      
      <div class="mt-6 text-center text-gray-400">
        <p>&copy; <span id="currentYear"></span> DApp. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js" type="application/javascript"></script>
  <script src="app.js"></script>
</body>
</html>
